[build-system]
# hatch-vcs must be in build-system.requires (not just a dev dependency) because
# hatchling resolves the dynamic version during the isolated build step before
# any project dependencies are installed. Without it here, `python -m build`
# fails with "unknown version source 'vcs'" in the isolated build environment.
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "dnp3py"
dynamic = ["version"]
description = "Pure Python DNP3 implementation (IEEE 1815-2012)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Typing :: Typed",
]

[dependency-groups]
# Installed by default with `uv sync`. ruff is pinned to match .pre-commit-config.yaml;
# update both together.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "mypy>=1.8",
    "ruff==0.15.18",
    "pre-commit>=4.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/dnp3"]
# Profile data lives under src/dnp3/mesa/data/profiles/ (inside the package,
# not at the repo root) precisely so it ships in both the built wheel and an
# editable install, and so the CLI can resolve it via importlib.resources
# instead of a __file__-relative path that breaks once installed.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = "dnp3.outstation.tcp_runner"
# Pre-existing type errors in tcp_runner.py surfaced by mypy 1.14 strict mode.
# Tracked as a hardening item outside the MESA module scope (DNP-016).
# Scoped per error code instead of ignore_errors so any new errors are visible.
disable_error_code = ["type-arg", "assignment", "arg-type"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "PLR",    # pylint refactor
    "PLW",    # pylint warnings
    "RUF",    # ruff-specific
]
ignore = [
    "PLR0911",  # too many return statements (expected for protocol handlers)
    "PLR0912",  # too many branches (expected for protocol handlers)
    "PLR0913",  # too many arguments (we need this for configs)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]  # magic values OK in tests
# tcp_runner.py carries pre-existing style debt (SIM105 try/except/pass teardowns,
# PLR0915 large handler method, PLR2004 magic literal) tracked under DNP-016.
# Suppress here rather than restructuring out of PR-B scope.
"src/dnp3/outstation/tcp_runner.py" = ["SIM105", "PLR0915", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = []

[tool.coverage.run]
source = ["src/dnp3"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
]
fail_under = 95
show_missing = true
