[build-system]
# hatch-vcs must be in build-system.requires (not just a dev dependency) because
# hatchling resolves the dynamic version during the isolated build step before
# any project dependencies are installed. Without it here, `python -m build`
# fails with "unknown version source 'vcs'" in the isolated build environment.
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "dnp3py"
dynamic = ["version"]
description = "Pure Python DNP3 implementation (IEEE 1815-2012)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Typing :: Typed",
]

[dependency-groups]
# Installed by default with `uv sync`. ruff is pinned to match .pre-commit-config.yaml
# and .github/workflows/ci.yml; update all three together.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "mypy>=1.8",
    "ruff==0.15.18",
    "nox>=2024.0",
    "pre-commit>=4.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/dnp3"]
# Profile data lives under src/dnp3/mesa/data/profiles/ (inside the package,
# not at the repo root) precisely so it ships in both the built wheel and an
# editable install, and so the CLI can resolve it via importlib.resources
# instead of a __file__-relative path that breaks once installed.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "PLR",    # pylint refactor
    "PLW",    # pylint warnings
    "RUF",    # ruff-specific
]
ignore = [
    "PLR0911",  # too many return statements (expected for protocol handlers)
    "PLR0912",  # too many branches (expected for protocol handlers)
    "PLR0913",  # too many arguments (we need this for configs)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]  # magic values OK in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".nox"]
skips = []

[tool.coverage.run]
source = ["src/dnp3"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
]
fail_under = 95
show_missing = true

# python-semantic-release: tag-authoritative, no source-file version rewriting.
# PSR computes the semver bump from conventional commits, writes CHANGELOG.md,
# creates the GitHub release, and pushes the tag. hatch-vcs then derives the
# version from the tag at build time. We do NOT set version_variables so PSR
# never rewrites a source constant.
#
# upload_to_pypi = false: PyPI publication is handled solely by the dedicated
# OIDC trusted-publisher job in release.yml. Enabling PSR's own PyPI upload
# would create a double-publish path and PSR has no OIDC credentials, making
# it either a hard failure or a non-OIDC route that defeats trusted-publisher.
#
# build_command = "": PSR must NOT build or attach a distribution to the
# GitHub release (assets is also unset, defaulting to []). The wheel that
# reaches PyPI is rebuilt from the tag by the separate publish-pypi job.
#
# PSR's UPDATE-mode template only inserts new content at the
# `<!-- version list -->` insertion_flag marker (set below, under
# [tool.semantic_release.changelog]) and silently renders a byte-identical
# CHANGELOG.md, with no error, when the marker is absent.
#
# branch = "main": PSR runs on main and pushes the tag and the changelog commit
# back to main.
[tool.semantic_release]
version_toml = []
version_variables = []
tag_format = "v{version}"
branch = "main"
build_command = ""
dist_path = "dist/"
upload_to_pypi = false
upload_to_release = true
commit_parser = "conventional"
logging_use_named_masks = false
major_on_zero = false
allow_zero_version = true

# changelog_sections documents the intended type-to-Keep-a-Changelog-section
# mapping, but PSR's built-in template does not read this key: matching its
# output needs a custom Jinja2 template (changelog.template_dir) that does not
# exist yet.
[tool.semantic_release.changelog]
insertion_flag = "<!-- version list -->"
changelog_sections = [
    {type = "feat", section = "Added"},
    {type = "fix", section = "Fixed"},
    {type = "perf", section = "Changed"},
    {type = "refactor", section = "Changed"},
    {type = "docs", section = "Changed"},
]
